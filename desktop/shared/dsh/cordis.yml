# DeepSeek Harness (dsh) ACP server composition for Helix sandboxes.
#
# Loaded by /usr/local/bin/dsh-acp, which Zed spawns as the `dsh` agent_server.
# Modelled on upstream's examples/acp-agent/cordis.yml, with two deliberate
# differences: the DeepSeek adapter is replaced by the generic pi-ai adapter
# pointed at the Helix OpenAI-compatible proxy, and the whole route is driven
# by environment variables that settings-sync-daemon sets per session.
#
# Stdout is the ACP JSON-RPC wire. Nothing here may install a stdout logger.

# The LLM route. Every provider Helix exposes is reached through one
# OpenAI-compatible endpoint, so there is a single hand-declared route whose
# model id carries the provider prefix the proxy routes on ("openai/gpt-5").
#
# `apiKeyEnv` is a credential *reference*, not the secret: pi-ai resolves it
# per request, so the key never enters this file or a session log.
#
# The model is declared by hand rather than discovered, which means pi-ai has
# no catalogue entry for it. Two consequences are load-bearing:
#   - it is text-only unless `defaultInput` says otherwise, so image prompts
#     are refused before they are sent; and
#   - it declares no `reasoningEfforts`, so no reasoning parameter is sent and
#     the provider's own default applies.
# Helix's per-model effort table (api/pkg/model/reasoning_efforts.go) is not
# plumbed through to this file yet; sending a level a model rejects is a hard
# 400 that aborts the turn, so sending nothing is the safe default.
#
# `retryPolicy` is set explicitly rather than inherited. dsh-llm's defaults are
# `maxRetries: 2` / `initialDelayMs: 500`, which gives up after ~2.3 seconds —
# shorter than any real provider blip. On 2026-08-18 a 42-second upstream
# outage (Caddy returning `502 upstream unavailable` while its vLLM backend
# restarted) aborted every in-flight dsh turn, while opencode sessions hitting
# the identical 502s retried longer and completed. A turn that dies here is not
# recoverable: Zed reports it as `AcpThreadEvent::Error` and Helix marks the
# whole spec task failed.
#
# 8 retries at 1s doubling to a 30s cap is a ~90-second window — long enough to
# ride out a backend restart, and bounded so a genuinely dead provider still
# fails the turn instead of hanging it. The retryable set is dsh-llm's default
# (EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT); 5xx classifies as
# SERVER, and 4xx deliberately does not retry.
- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      helix:
        displayName: Helix
        apiKeyEnv: HELIX_API_KEY
        api: openai-completions
        baseURL: !!js process.env.HELIX_BASE_URL
        retryPolicy:
          mode: normal
          maxRetries: 8
          backoff:
            initialDelayMs: 1000
            maxDelayMs: 30000
            jitterRatio: 0.2
        models:
          - id: !!js process.env.HELIX_MODEL

# Sandboxing. The container IS the sandbox — the agent is already confined to
# a per-session desktop container with only that session's workspace — so the
# default is full access. A narrower mode would make the agent raise
# `session/request_permission` on its first write outside the workspace, and a
# headless spec task has nobody to answer it: the turn would stall until it
# timed out. This is dsh's equivalent of `--yolo` for qwen and
# `permission: allow` for opencode.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'danger-full-access'"
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

# `never` matches the sandbox mode above: with full access granted there is
# nothing left to ask about, and asking would deadlock a headless session.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

# The ACP app itself: agent spine + JSONL persistence + the protocol bridge.
- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: helix
    model: !!js process.env.HELIX_MODEL
    dshHome: !!js process.env.DSH_HOME
    persistenceRoot: !!js process.env.DSH_SESSIONS_ROOT
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding assistant running inside a Helix sandbox on the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or its tests. Keep answers brief and factual.

# MCP servers, mounted here rather than handed over the protocol.
#
# Zed passes the project's context servers in `session/new.mcpServers`, and
# dsh's ACP transport REJECTS a non-empty list outright
# (-32602 "mcpServers is not supported"), which fails session creation and
# leaves the task hanging with no visible error. settings-sync-daemon
# therefore withholds context_servers from settings.json for this runtime and
# writes the same set here instead, as one dsh-mcp-client entry per server —
# which is where dsh expects MCP servers to be configured. The model sees the
# usual `mcp__<server>__<tool>` names either way.
#
# The file is per-session (it carries that session's bearer tokens) and
# rewritten on every settings sync. `initial: []` covers a session with no MCP
# servers and the window before the daemon's first write.
#
# The path is a literal, not `!!js process.env.…`: the loader resolves an
# include's `path` without evaluating js tags, so an env reference silently
# arrives as "" and fails with `extension "" not supported`. It is kept in
# lockstep with DeepSeekHarnessMCPConfigPath in
# api/cmd/settings-sync-daemon/deepseek_harness.go.
#
# The daemon writes the file read-only so include's write-back path stays off
# — the daemon is the only writer.
- id: mcp-servers
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: /home/retro/.config/helix-dsh/mcp.cordis.json
    initial: []

# Context pressure: measure it, then summarize an older range before the
# provider would overflow. Ratios scale against the routed model's window,
# which for a hand-declared model is the route's 262144-token fallback.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

# Filesystem stack, fenced by the same policy as bash.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Backed by ripgrep, which the desktop image already installs. The over-cap
# contract is required with no default: `false` keeps the modification-time
# ordered head, matching what Claude Code's GlobTool does and what a model
# reading a repo expects, rather than sampling across top-level directories.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
