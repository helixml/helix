{{- if not .Values.controlplane.regularAuthJWTSecretExistingSecret -}}
{{- $name := printf "%s-jwt-secret" (include "helix-controlplane.fullname" .) -}}
{{- $secret := .Values.controlplane.regularAuthJWTSecret -}}
{{- if not $secret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data (index $existing.data "jwt-secret") -}}
{{- $secret = index $existing.data "jwt-secret" | b64dec -}}
{{- else -}}
{{- $secret = randAlphaNum 64 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "helix-controlplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
  annotations:
    # Keep the key on uninstall so a reinstall does not sign everyone out.
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-secret: {{ $secret | b64enc | quote }}
{{- end -}}
