{{- if and .Values.chrome.enabled (not .Values.chrome.launcherTokenExistingSecret) }}
# Shared secret between the controlplane and the browser manager (chrome).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helix-controlplane.chrome-launcher-secret" . }}
  labels:
    {{- include "helix-controlplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: chrome
type: Opaque
stringData:
  token: {{ include "helix-controlplane.chrome-launcher-token" . | quote }}
{{- end }}
