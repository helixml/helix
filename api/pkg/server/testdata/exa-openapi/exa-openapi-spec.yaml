                  default: 0
                - type: "null"
            imageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Number of images to return for each result.
                  default: 0
                - type: "null"
            richImageLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  description: Number of rich image links to return for each result.
                  default: 0
                - type: "null"
            richLinks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  default: 0
                  description: Deprecated. Number of rich links to return for each result.
                  x-exa-lifecycle: deprecated
                  deprecated: true
                - type: "null"
            codeBlocks:
              anyOf:
                - type: integer
                  minimum: 0
                  maximum: 1000
                  default: 0
                  description: Deprecated. Number of code blocks to return for each result.
                  x-exa-lifecycle: deprecated
                  deprecated: true
                - type: "null"
          additionalProperties: false
          description: Extra parameters to pass.
        livecrawl:
          description: Crawl strategy for fetching page content
          oneOf:
            - type: string
              enum:
                - never
                - always
                - fallback
                - preferred
            - type: string
              const: auto
        livecrawlTimeout:
          type: integer
          exclusiveMinimum: 0
          maximum: 90000
          description: The timeout for livecrawling in milliseconds.
          default: 10000
        maxAgeHours:
          type: integer
          minimum: -1
          maximum: 720
          description: Maximum age of cached content, in hours, up to 720. Cached content younger than this is used, and older pages are fetched fresh. `0` always fetches fresh content and `-1` always uses the cache. When omitted, cached content is used when available and pages without it are fetched live.
        filterEmptyResults:
          type: boolean
          description: Filter out results with no content
        subpages:
          type: integer
          minimum: 0
          maximum: 100
          description: The number of subpages to crawl. The actual number crawled may be limited by system constraints.
          default: 0
        subpageTarget:
          description: Term to find specific subpages of search results. Can be a single string or an array of strings.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - minItems: 0
              maxItems: 100
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 100
        context:
          description: Deprecated. Use `highlights` or `text` instead. Returns page contents as a combined context string.
          x-exa-lifecycle: deprecated
          deprecated: true
          x-exa-replacement:
            - highlights
            - text
          oneOf:
            - type: boolean
              description: Deprecated. Use `highlights` or `text` instead. Returns page contents as a combined context string.
              x-exa-lifecycle: deprecated
              deprecated: true
              x-exa-replacement:
                - highlights
                - text
            - type: object
              properties:
                maxCharacters:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: Maximum character limit for the context string.
              additionalProperties: false
              description: Deprecated. Use `highlights` or `text` instead. Returns page contents as a combined context string.
              x-exa-lifecycle: deprecated
              deprecated: true
              x-exa-replacement:
                - highlights
                - text
      additionalProperties: false
      description: Content extraction options applied to each search result. All fields are optional.
    SummaryWithMaxTokensOptionsOutput:
      type: object
