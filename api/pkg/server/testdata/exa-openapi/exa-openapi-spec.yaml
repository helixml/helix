                            date:
                              anyOf:
                                - type: string
                                - type: "null"
                              description: Funding round date.
                            amount:
                              anyOf:
                                - type: number
                                - type: "null"
                              description: Funding round amount in USD.
                          required:
                            - name
                            - date
                            - amount
                          additionalProperties: false
                        - type: "null"
                      description: Most recent funding round, when available.
                  required:
                    - revenueAnnual
                    - fundingTotal
                    - fundingLatestRound
                  additionalProperties: false
                - type: "null"
              description: Company financial information.
            webTraffic:
              anyOf:
                - type: object
                  properties:
                    visitsMonthly:
                      anyOf:
                        - type: number
                        - type: "null"
                      description: Estimated monthly website visits.
                    countryRank:
                      anyOf:
                        - type: integer
                        - type: "null"
                      description: Estimated website traffic rank within the company's primary country.
                    avgDurationSeconds:
                      anyOf:
                        - type: number
                        - type: "null"
