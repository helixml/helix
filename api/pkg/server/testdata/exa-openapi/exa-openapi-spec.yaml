        query:
          anyOf:
            - type: string
              description: Custom query for the LLM-generated summary.
            - type: "null"
        maxTokens:
          type: integer
          minimum: 1
          description: Deprecated. Maximum tokens for the generated summary.
          x-exa-lifecycle: deprecated
          deprecated: true
      additionalProperties: false
    SearchMonitorTriggerOutput:
      type: object
      properties:
        type:
          type: string
          const: interval
          description: The type of trigger. Currently only `interval` is supported.
          default: interval
        period:
          type: string
          description: A duration string specifying how often the monitor runs (e.g., "1h", "6h", "1d", "7d"). Single-unit only. Minimum interval is 1 hour. The schedule is anchored to the monitor's creation time (e.g., a daily monitor created at 2:30 PM runs daily around 2:30 PM).
      required:
        - type
        - period
      additionalProperties: false
    SearchMonitorOutputSchemaOutput:
      anyOf:
        - oneOf:
            - $ref: "#/components/schemas/OutputSchemaTextOutput"
            - $ref: "#/components/schemas/OutputSchemaObject"
          description: JSON schema for synthesized output. Supported root types are "text" and "object". When provided, the response includes an output object whose content matches this schema. Works with every search type and adds about 2 seconds of synthesis latency on top of the selected search type. Object schemas are limited to 10 properties in total (nested and array items properties count toward the limit) and 2 levels of nesting, and every array must define items.
