components:
  schemas:
    SearchRequest:
      type: object
      properties:
        includeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: List of domains or domain paths to include in the search. Each entry can be a hostname (for example, `example.com`), a hostname with a path prefix (for example, `example.com/docs`), or a wildcard subdomain (for example, `*.example.com`). If specified, results will only come from the matching domains or paths. Use this parameter for domain or path filtering instead of adding a `site:` operator to the query.
            - type: "null"
        excludeDomains:
          anyOf:
            - maxItems: 1200
              type: array
              items:
                type: string
              description: List of domains or domain paths to exclude from search results. Each entry can be a hostname (for example, `example.com`), a hostname with a path prefix (for example, `example.com/docs`), or a wildcard subdomain (for example, `*.example.com`). If specified, no results will be returned from the matching domains or paths. Use this parameter for domain or path filtering instead of adding a `site:` operator to the query.
            - type: "null"
        startPublishedDate:
          anyOf:
            - type: string
              description: Only links with a published date after this will be returned. Must be specified in ISO 8601 format.
              format: date-time
            - type: "null"
        endPublishedDate:
          anyOf:
            - type: string
              description: Only links with a published date before this will be returned. Must be specified in ISO 8601 format.
              format: date-time
            - type: "null"
        numResults:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 100
              description: Number of results to return. Limits vary by search type. The maximum public limit is 100 results. Contact sales (hello@exa.ai) to discuss higher limits.
              default: 10
            - type: "null"
        moderation:
          anyOf:
            - type: boolean
              description: Enable content moderation to filter unsafe content from search results.
              default: false
            - type: "null"
        contents:
          anyOf:
            - description: Content options for text, highlights, summary, extras, and freshness controls.
              $ref: "#/components/schemas/ContentsOptions"
            - type: "null"
        query:
          type: string
          minLength: 1
          description: The query string for the search.
        additionalQueries:
          anyOf:
            - minItems: 1
              maxItems: 10
              type: array
              items:
                type: string
              description: Additional query variations for deep-search variants. Only works with a deep-search type. When provided, these queries are used alongside the main query for broader results.
            - type: "null"
        type:
          anyOf:
            - type: string
              const: auto
              description: The default. A balanced mode that optimizes for both quality and speed and is recommended for most applications.
              title: auto
            - type: string
              const: lite
              description: Low-cost, low-latency search for real-time and interactive experiences such as chat, voice agents, and autocomplete. Accepts only `query` (a single string), `objective`, `userIdentifier`, `metadata`, `category`, `numResults`, `contents.highlights`, `contents.text`, `contents.snapshotAsOf`, `userLocation`, `includeDomains`, `excludeDomains`, `startPublishedDate`, `endPublishedDate`, `moderation`, and `compliance`; a request that sets any other parameter is rejected. Serves cached content only; it never fetches live, so the freshness options are rejected.
              title: lite
            - type: string
              const: deep-lite
              description: Performs lightweight research with synthesized results and a consistent 4-second latency, lower than full deep search.
              title: deep-lite
            - type: string
              const: deep
              description: Conducts comprehensive multi-step research with synthesis.
              title: deep
            - type: string
              const: instant
              description: Legacy. Use `lite` instead. Runs a minimum-latency search that trades some search depth for speed. Unlike `lite`, it accepts every search parameter.
              x-exa-lifecycle: legacy
              x-exa-replacement: lite
              x-mint:
                post:
                  - Legacy
              title: instant
            - type: string
              const: fast
              description: Legacy. Use `lite` instead. Runs a reduced-latency search for user-facing and interactive workflows. Unlike `lite`, it accepts every search parameter.
              x-exa-lifecycle: legacy
              x-exa-replacement: lite
              x-mint:
                post:
                  - Legacy
              title: fast
            - type: string
              const: deep-reasoning
              description: Legacy. Use `deep` instead. Runs `deep` with stronger reasoning at each step, for complex analysis and decision-making tasks. For agentic, multi-step research, use the Agent API.
              x-exa-lifecycle: legacy
              x-exa-replacement: deep
              x-mint:
                post:
                  - Legacy
              title: deep-reasoning
            - type: string
              title: Other values
            - type: "null"
          description: |-
            The search mode to use. Defaults to `auto`, a balanced mode recommended for most applications.

            - `auto`: The default. A balanced mode that optimizes for both quality and speed and is recommended for most applications.
            - `lite`: Low-cost, low-latency search for real-time and interactive experiences such as chat, voice agents, and autocomplete. Accepts only `query` (a single string), `objective`, `userIdentifier`, `metadata`, `category`, `numResults`, `contents.highlights`, `contents.text`, `contents.snapshotAsOf`, `userLocation`, `includeDomains`, `excludeDomains`, `startPublishedDate`, `endPublishedDate`, `moderation`, and `compliance`; a request that sets any other parameter is rejected. Serves cached content only; it never fetches live, so the freshness options are rejected.
            - `deep-lite`: Performs lightweight research with synthesized results and a consistent 4-second latency, lower than full deep search.
            - `deep`: Conducts comprehensive multi-step research with synthesis.
            - `instant`: Legacy. Use `lite` instead. Runs a minimum-latency search that trades some search depth for speed. Unlike `lite`, it accepts every search parameter.
            - `fast`: Legacy. Use `lite` instead. Runs a reduced-latency search for user-facing and interactive workflows. Unlike `lite`, it accepts every search parameter.
            - `deep-reasoning`: Legacy. Use `deep` instead. Runs `deep` with stronger reasoning at each step, for complex analysis and decision-making tasks. For agentic, multi-step research, use the Agent API.
          default: auto
          x-exa-enum-open: true
        category:
          anyOf:
            - type: string
              enum:
                - company
                - publication
                - news
                - personal site
                - financial report
                - people
              description: A data category to focus on. Other strings are accepted and used as category hints. `people` and `company` return higher-quality people profiles and company pages. `publication` returns scholarly publications such as research papers, preprints, and journal articles, with metadata like authors, venue, and citations. `company` and `people` do not support `startPublishedDate` or `endPublishedDate`, and `people` also does not support `excludeDomains`. Requests that set an unsupported filter return a 400 error.
            - type: "null"
        userLocation:
          anyOf:
            - description: The end user's location, as a two-letter ISO 3166-1 country code (e.g. `US`) or an object with `country`, a `latitude` and `longitude` pair, or both. The country localizes results. Coordinates are used only for queries that name no place but depend on where the user is, such as "coffee near me". They do not set a country, so send `country` with them to localize results. Send only the precision your use case needs.
              oneOf:
                - type: string
                  description: The two-letter ISO 3166-1 country code of the user, e.g. `US`.
                - type: object
                  properties:
                    country:
                      type: string
                      description: The two-letter ISO 3166-1 country code of the user, e.g. `US`.
                  required:
                    - country
                  additionalProperties: false
                  description: The user's country only. Equivalent to the string form.
                - type: object
                  properties:
                    country:
                      type: string
                      description: The two-letter ISO 3166-1 country code of the user, e.g. `US`.
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                      description: The user's latitude in decimal degrees.
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                      description: The user's longitude in decimal degrees.
                  required:
                    - latitude
                    - longitude
                  additionalProperties: false
                  description: The user's coordinates, with an optional country.
            - type: "null"
        compliance:
          anyOf:
            - type: string
              enum:
                - hipaa
              description: Enterprise-only compliance mode. Set to `hipaa` for HIPAA mode. Requires cache-only retrieval with supported parameters. See the HIPAA docs for details.
            - type: "null"
        outputSchema:
          anyOf:
            - oneOf:
                - $ref: "#/components/schemas/OutputSchemaText"
                - $ref: "#/components/schemas/OutputSchemaObject"
              description: JSON schema for synthesized output. Supported root types are "text" and "object". When provided, the response includes an output object whose content matches this schema. Works with every search type and adds about 2 seconds of synthesis latency on top of the selected search type. Object schemas are limited to 10 properties in total (nested and array items properties count toward the limit) and 2 levels of nesting, and every array must define items.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  text: "#/components/schemas/OutputSchemaText"
                  object: "#/components/schemas/OutputSchemaObject"
            - type: "null"
        objective:
          anyOf:
            - type: string
              maxLength: 4096
            - type: "null"
          description: 'The broader goal this search serves: the task the caller is working on, beyond the query itself. When exposing this field to an agent as a tool parameter, describe it as: "Goal for this search turn; say which documents should rank first, which should be excluded, and what specific facts or figures to pull from them."'
        userIdentifier:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 64
              pattern: ^[A-Za-z0-9_-]+$
            - type: "null"
          description: "An opaque ID your platform assigns to the end user this request is made for, such as a UUID. Lets Exa attribute usage to that end user rather than your whole team. Must not contain personal information such as an email address, phone number, username, or name. Hash such values before sending them. 1 to 64 characters: letters, digits, underscores, and hyphens. Retained even when your team has Zero Data Retention enabled. Does not affect results."
          example: 7f3a9c52-1d4e-4b8a-9e60-2c5d8a1f0b37
        systemPrompt:
          anyOf:
            - type: string
              description: Additional instructions that guide generated output or agent behavior. Use this for source preferences, novelty constraints, duplication constraints, or other behavior guidance.
            - type: "null"
        stream:
          anyOf:
            - type: boolean
              description: Requests server-sent events for synthesized output streaming. Streaming is currently used only when outputSchema is provided; otherwise the endpoint returns the normal JSON search response.
              default: false
            - type: "null"
        startCrawlDate:
          anyOf:
            - type: string
              format: date-time
              description: Deprecated. Ignored by the API. Setting it adds an `IGNORED_FIELD` warning to the response's `warnings`.
              x-exa-lifecycle: deprecated
              deprecated: true
            - type: "null"
        endCrawlDate:
          anyOf:
            - type: string
              format: date-time
              description: Deprecated. Ignored by the API. Setting it adds an `IGNORED_FIELD` warning to the response's `warnings`.
              x-exa-lifecycle: deprecated
              deprecated: true
            - type: "null"
        includeText:
          anyOf:
            - maxItems: 50
              type: array
              items:
                type: string
                maxLength: 4096
            - type: "null"
          description: Deprecated. List of strings that must be present in the webpage text of results. Matching is approximate (word-level rather than exact phrase), so a multi-word entry can match pages where its words appear separately. Up to 50 strings, each up to 4096 characters.
          x-exa-lifecycle: deprecated
          deprecated: true
        excludeText:
