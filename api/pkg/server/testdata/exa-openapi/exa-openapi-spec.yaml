      properties:
        text:
          type: string
          description: Natural-language answer or summary.
        structured:
          anyOf:
            - $ref: "#/components/schemas/JsonValue"
            - type: "null"
          description: JSON shaped by `outputSchema`; fields unsupported by evidence may be `null`. `null` when no schema was provided.
        grounding:
          type: array
          items:
            $ref: "#/components/schemas/AgentGrounding"
          description: Field-level citations emitted by the run.
      required:
        - text
        - structured
        - grounding
      additionalProperties: false
    AgentGrounding:
      type: object
      properties:
        field:
          type: string
          description: Output field the citations support.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AgentCitation"
        confidence:
          anyOf:
            - type: string
              enum:
                - low
                - medium
                - high
              description: Model-reported reliability for this field.
            - type: "null"
      required:
        - field
        - citations
      additionalProperties: false
    AgentCitation:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Source URL.
        title:
          type: string
          description: Source title.
      required:
        - url
      additionalProperties: false
    AgentUsage:
      type: object
      properties:
        agentComputeUnits:
          type: number
          minimum: 0
        searches:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceUsage"
      required:
        - agentComputeUnits
        - searches
        - emails
        - phoneNumbers
      additionalProperties: false
      description: Billed usage for the run. When an `auto` or `ultra` run's metered cost exceeds `budget.maxCostDollars`, the run is billed the budget and each quantity except `dataSources` is scaled down in proportion, so quantities can be fractional.
    AgentDataSourceUsage:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: integer
        minimum: 0
      description: Per-provider tool call counts for Exa Connect data sources used during the run. Keys are provider names (e.g. `fiber`, `similarweb`). Only providers with non-zero usage are included.
    AgentCostDollars:
      type: object
      properties:
        total:
          type: number
          minimum: 0
        agentCompute:
          type: number
          minimum: 0
        search:
          type: number
          minimum: 0
        emails:
          type: number
          minimum: 0
        phoneNumbers:
          type: number
          minimum: 0
        dataSources:
          $ref: "#/components/schemas/AgentDataSourceCost"
      required:
        - total
        - agentCompute
        - search
        - emails
        - phoneNumbers
      additionalProperties: false
    AgentDataSourceCost:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        type: number
        minimum: 0
      description: Per-provider cost in dollars for Exa Connect data sources used during the run. Keys are provider names (e.g. `fiber`, `similarweb`). Only providers with non-zero usage are included.
    AgentErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/AgentError"
      required:
        - error
      additionalProperties: false
    AgentError:
      type: object
      properties:
        type:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_ERROR
            - RATE_LIMIT_ERROR
            - NOT_FOUND
            - SERVER_ERROR
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - TEAM_NOT_FOUND
            - RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_FOUND
            - PREVIOUS_RUN_NOT_COMPLETED
            - CONCURRENCY_LIMIT_REACHED
            - INVALID_OUTPUT_SCHEMA
            - INVALID_DATA_SOURCE
            - TIMEOUT
            - SERVER_ERROR
        message:
          type: string
      required:
        - type
        - code
        - message
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    AgentRunList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        hasMore:
          type: boolean
          description: Whether there are more results
        nextCursor:
          anyOf:
            - $ref: "#/components/schemas/AgentRunId"
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeleteAgentRunResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AgentRunId"
        object:
          type: string
          const: agent_run.deleted
        deleted:
          type: boolean
          const: true
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    AgentRunEventList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        hasMore:
          type: boolean
          description: Whether there are more results
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    Batch:
      type: object
      properties:
        id:
          type: string
          description: Batch ID. New batch IDs are returned with the `batch_` prefix.
        object:
          type: string
          const: batch
          description: The object type, always `batch`.
        status:
          $ref: "#/components/schemas/BatchStatus"
        requestCounts:
          $ref: "#/components/schemas/BatchRequestCounts"
        createdAt:
          type: string
          format: date-time
          description: When the batch was created.
        expiresAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the batch expires, or `null` if it does not expire.
          format: date-time
        endedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the batch reached a terminal status, or `null` while it is still running.
          format: date-time
        resultsUrl:
          anyOf:
            - type: string
            - type: "null"
          description: Short-lived download URL for the batch results file (JSONL), or `null` until the batch completes. Fetch it directly, without an API key. Retrieve the batch again for a fresh URL after it expires.
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: Caller-provided key-value metadata for your own tracking.
      required:
        - id
        - object
        - status
        - requestCounts
        - createdAt
        - expiresAt
        - endedAt
        - resultsUrl
        - metadata
      additionalProperties: false
    BatchStatus:
      type: string
      enum:
        - in_progress
        - completed
        - cancelling
        - cancelled
        - expired
      description: Lifecycle status of the batch.
    BatchRequestCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          description: Total requests in the batch.
        completed:
          type: integer
          minimum: 0
          description: Requests that have completed successfully.
        failed:
          type: integer
          minimum: 0
          description: Requests that have failed.
      required:
        - total
        - completed
        - failed
      additionalProperties: false
    BatchList:
      type: object
      properties:
        object:
          type: string
          const: list
          description: The object type, always `list`.
        data:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
          description: The page of batches, newest first.
        hasMore:
          type: boolean
          description: Whether there are more results
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          description: Cursor for the next page
      required:
        - object
        - data
        - hasMore
        - nextCursor
      additionalProperties: false
    DeletedBatch:
      type: object
      properties:
        id:
          type: string
          description: ID of the deleted batch.
        object:
          type: string
          const: batch.deleted
          description: The object type, always `batch.deleted`.
        deleted:
          type: boolean
          const: true
          description: Always `true` for a successful delete.
      required:
        - id
        - object
        - deleted
      additionalProperties: false
    WebsetsTeamInfo:
      type: object
      properties:
        object:
          type: string
          const: team
          description: The object type, always `"team"`.
        id:
          type: string
          description: Unique identifier for the team.
        name:
          type: string
          description: Name of the team.
        concurrency:
          type: object
          properties:
            active:
              type: integer
              description: Number of requests currently being processed.
            queued:
              type: integer
              description: Number of requests currently queued.
          required:
            - active
            - queued
          additionalProperties: false
          description: Current concurrency usage.
        limits:
          type: object
          properties:
            maxConcurrent:
              anyOf:
                - type: integer
                - type: "null"
              description: Maximum number of concurrent requests allowed. Null means unlimited.
            maxQueued:
              anyOf:
                - type: integer
                - type: "null"
              description: Maximum number of queued requests allowed. Null means unlimited.
          required:
            - maxConcurrent
            - maxQueued
          additionalProperties: false
          description: Concurrency limits for the team.
      required:
        - object
        - id
        - name
        - concurrency
        - limits
      additionalProperties: false
    AnswerStreamChunk:
      description: "Schema for each JSON payload emitted in an `/answer` server-sent event stream. Each event is emitted as `data: <json>`."
      oneOf:
        - $ref: "#/components/schemas/AnswerStreamTextDeltaChunk"
        - $ref: "#/components/schemas/AnswerStreamCitationsChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamCostChunkOutput"
        - $ref: "#/components/schemas/AnswerStreamErrorChunkOutput"
    SearchStreamChunk:
      oneOf:
        - $ref: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
        - $ref: "#/components/schemas/SearchStreamGroundingChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResultsChunkOutput"
        - $ref: "#/components/schemas/SearchStreamResetChunkOutput"
        - $ref: "#/components/schemas/SearchStreamDoneChunkOutput"
        - $ref: "#/components/schemas/SearchStreamErrorChunkOutput"
      description: "Schema for each JSON payload emitted in a `/search` server-sent event stream. Each event is emitted as `data: <json>` and the stream terminates with `data: [DONE]`, which is not represented by this JSON schema."
      type: object
      discriminator:
        propertyName: type
        mapping:
          text-delta: "#/components/schemas/SearchStreamTextDeltaChunkOutput"
          grounding: "#/components/schemas/SearchStreamGroundingChunkOutput"
          results: "#/components/schemas/SearchStreamResultsChunkOutput"
          stream-reset: "#/components/schemas/SearchStreamResetChunkOutput"
          done: "#/components/schemas/SearchStreamDoneChunkOutput"
          error: "#/components/schemas/SearchStreamErrorChunkOutput"
    AgentRunEvent:
      type: object
      properties:
        id:
          type: string
          description: Event ID within the run.
        event:
          type: string
          enum:
            - agent_run.created
            - agent_run.started
            - agent_run.completed
            - agent_run.failed
            - agent_run.cancelled
        data:
          $ref: "#/components/schemas/JsonValue"
        createdAt:
          type: string
          format: date-time
          description: When the event was created
      required:
        - id
        - event
        - data
        - createdAt
      additionalProperties: false
    SearchResultOutput:
      type: object
      properties:
        title:
          type: string
          description: The title of the search result.
        url:
          type: string
          description: The URL of the search result.
          format: uri
        publishedDate:
          description: An estimate of the creation date, from parsing HTML content. Format is YYYY-MM-DD.
          format: date-time
          type: string
        author:
          description: If available, the author of the content.
          anyOf:
            - type: string
            - type: "null"
        id:
          description: The temporary ID for the document. Useful for the /contents endpoint.
          type: string
        image:
          description: The URL of an image associated with the search result, if available.
          format: uri
          type: string
        favicon:
          description: The URL of the favicon for the search result's domain.
          format: uri
          type: string
        text:
          description: The full content text of the search result.
          type: string
        highlights:
          description: Array of highlights extracted from the search result content.
          type: array
          items:
            type: string
        highlightScores:
          description: Array of cosine similarity scores for each highlighted snippet.
          type: array
          items:
            type: number
            format: float
        summary:
          description: Summary of the webpage.
          type: string
        subpages:
          description: Array of subpages for the search result.
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                description: The title of the search result.
              url:
                type: string
                description: The URL of the search result.
                format: uri
              publishedDate:
                description: An estimate of the creation date, from parsing HTML content. Format is YYYY-MM-DD.
                format: date-time
                type: string
              author:
                description: If available, the author of the content.
                anyOf:
                  - type: string
                  - type: "null"
              id:
                description: The temporary ID for the document. Useful for the /contents endpoint.
                type: string
              image:
                description: The URL of an image associated with the search result, if available.
                format: uri
                type: string
              favicon:
                description: The URL of the favicon for the search result's domain.
                format: uri
                type: string
            required:
              - title
              - url
            additionalProperties: false
        entities:
          description: Structured entity data for company, person, publication, or product search results. Returned for supported entity-backed categories and for product listing pages.
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/SearchCompanyEntityOutput"
              - $ref: "#/components/schemas/SearchPersonEntityOutput"
              - $ref: "#/components/schemas/SearchPublicationEntityOutput"
            type: object
            discriminator:
              propertyName: type
              mapping:
                company: "#/components/schemas/SearchCompanyEntityOutput"
                person: "#/components/schemas/SearchPersonEntityOutput"
                publication: "#/components/schemas/SearchPublicationEntityOutput"
        extras:
          description: Results from extras. Each field is returned only when requested via contents.extras.
          type: object
          properties:
            links:
              description: Array of links from the search result.
              type: array
              items:
                type: string
            imageLinks:
              description: Array of image URLs from the search result.
              type: array
              items:
                type: string
            richImageLinks:
              description: Array of images with their alt text, in the order the images appear on the page.
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: The URL of the image.
                  alt:
                    description: The alt text of the image, when the page provides one.
                    type: string
                required:
                  - url
                additionalProperties: false
            richLinks:
              description: Array of links with their anchor text, in the order they appear on the page.
              type: array
              items:
                type: object
                properties:
                  url:
                    type: string
                    description: The URL of the link.
                  anchor:
                    description: The anchor text of the link, when the page provides one.
                    type: string
                required:
                  - url
                additionalProperties: false
            codeBlocks:
              description: Array of code blocks from the search result.
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: The contents of the code block.
                  source:
                    type: string
                    description: The language the code block is annotated with, if any.
                required:
                  - text
                  - source
                additionalProperties: false
          additionalProperties: false
      required:
        - title
        - url
      additionalProperties: false
    SearchCompanyEntityOutput:
      type: object
      properties:
        id:
          type: string
          description: Stable company entity identifier.
        type:
          type: string
          const: company
